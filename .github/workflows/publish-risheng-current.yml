name: Publish current Risheng download

on:
  push:
    paths:
      - "release-parts/risheng-current.zip.part010"

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Rebuild current package
        shell: bash
        run: cat release-parts/risheng-current.zip.part* > risheng-latest.zip
      - name: Update release download
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view risheng-latest-v1 >/dev/null 2>&1 ||
            gh release create risheng-latest-v1 --title "Risheng latest" --notes "Offline tool latest version"
          gh release upload risheng-latest-v1 risheng-latest.zip --clobber
